<style>
  /* CSS Variables - Design Tokens */
  :root {
    --kg-navy: #071a3d;
    --kg-blue: #1e3a8a;
    --kg-blue-light: #eff6ff;
    --kg-orange: #f97316;
    --kg-orange-light: #fff7ed;
    --kg-green: #10b981;
    --kg-green-light: #ecfdf5;
    --kg-red: #ef4444;
    --kg-red-light: #fef2f2;
    
    --kg-bg: #f8fafc;
    --kg-surface: #ffffff;
    --kg-surface-trans: rgba(255, 255, 255, 0.85);
    --kg-border: #e2e8f0;
    --kg-text: #0f172a;
    --kg-text-muted: #64748b;
    
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.02);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.03);
    
    --transition-fast: 0.15s ease;
    --transition-normal: 0.25s ease;
  }

  /* Reset & Core */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--kg-bg);
    color: var(--kg-text);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  /* App Layout */
  .app {
    display: flex;
    width: 100%;
    min-height: 100vh;
  }

  /* Sidebar Navigation */
  .sidebar {
    width: 260px;
    background-color: var(--kg-navy);
    color: #ffffff;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    flex-shrink: 0;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: var(--shadow-lg);
  }

  .brand {
    text-align: center;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .brand .crown {
    font-size: 32px;
    color: var(--kg-orange);
    line-height: 1;
    margin-bottom: 6px;
  }

  .brand .name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1.5px;
  }

  .brand .sub {
    font-size: 9px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 600;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .nav-link {
    display: block;
    padding: 12px 16px;
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    font-weight: 500;
    font-size: 13.5px;
    border-radius: var(--radius-sm);
    transition: var(--transition-fast);
  }

  .nav-link:hover {
    color: #ffffff;
    background-color: rgba(255, 255, 255, 0.05);
  }

  .nav-link.active {
    color: #ffffff;
    background-color: var(--kg-orange);
    font-weight: 600;
  }

  /* Main Workspace Area */
  .main {
    flex-grow: 1;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
    max-width: calc(100% - 260px);
  }

  .hero-title {
    border-bottom: 1px solid var(--kg-border);
    padding-bottom: 16px;
  }

  .hero-title h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--kg-navy);
  }

  .hero-title p {
    font-size: 13px;
    color: var(--kg-text-muted);
    margin-top: 4px;
  }

  /* Views and sections visibility */
  .view-section {
    display: none;
    flex-direction: column;
    gap: 20px;
    animation: fadeIn 0.3s ease;
  }

  .view-section.active {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-header {
    font-size: 18px;
    font-weight: 700;
    color: var(--kg-navy);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Cards (Glassmorphic & Premium Design) */
  .card {
    background: var(--kg-surface-trans);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--kg-border);
    border-radius: var(--radius-md);
    padding: 20px;
    box-shadow: var(--shadow-md);
    transition: box-shadow var(--transition-normal);
  }

  .card:hover {
    box-shadow: var(--shadow-lg);
  }

  .card.stat {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
    border-left: 4px solid var(--kg-navy);
    position: relative;
    overflow: hidden;
  }

  .card.stat.green { border-left-color: var(--kg-green); }
  .card.stat.blue { border-left-color: var(--kg-blue); }
  .card.stat.orange { border-left-color: var(--kg-orange); }
  .card.stat.red { border-left-color: var(--kg-red); }

  .card.stat .label {
    font-size: 11px;
    font-weight: 600;
    color: var(--kg-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card.stat .value {
    font-size: 24px;
    font-weight: 800;
    color: var(--kg-navy);
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }

  /* Grid Layouts */
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 18px;
  }

  .span-12 { grid-column: span 12; }
  .span-8 { grid-column: span 8; }
  .span-7 { grid-column: span 7; }
  .span-6 { grid-column: span 6; }
  .span-5 { grid-column: span 5; }
  .span-4 { grid-column: span 4; }
  .span-3 { grid-column: span 3; }

  .flex-col { display: flex; flex-direction: column; }
  .flex-row { display: flex; flex-direction: row; }
  .flex-grow { flex-grow: 1; }
  .items-center { align-items: center; }
  .items-end { align-items: flex-end; }
  .justify-between { justify-content: space-between; }
  .justify-end { justify-content: flex-end; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }

  /* Panels titles */
  .panel-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--kg-navy);
    margin-bottom: 14px;
  }

  .panel-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .panel-header-row .panel-title {
    margin-bottom: 0;
  }

  /* Forms and fields */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 11px;
    font-weight: 600;
    color: var(--kg-text-muted);
  }

  input[type="text"],
  input[type="number"],
  input[type="month"],
  select,
  textarea {
    width: 100%;
    min-height: 36px;
    padding: 8px 12px;
    border: 1px solid var(--kg-border);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-family: inherit;
    color: var(--kg-text);
    background-color: var(--kg-surface);
    outline: none;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }

  input[type="text"]:focus,
  input[type="number"]:focus,
  input[type="month"]:focus,
  select:focus,
  textarea:focus {
    border-color: var(--kg-blue);
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 36px;
    padding: 8px 16px;
    border: 0;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    transition: var(--transition-fast);
    background-color: var(--kg-navy);
    color: #ffffff;
  }

  .btn:hover {
    filter: brightness(1.08);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn.light {
    background-color: #f1f5f9;
    color: var(--kg-text);
    border: 1px solid var(--kg-border);
  }

  .btn.light:hover {
    background-color: #e2e8f0;
  }

  .btn.green { background-color: var(--kg-green); }
  .btn.orange { background-color: var(--kg-orange); }
  .btn.blue { background-color: var(--kg-blue); }
  .btn.red { background-color: var(--kg-red); }

  .bg-blue { background-color: var(--kg-blue) !important; color: #fff !important; }
  .bg-green { background-color: var(--kg-green) !important; color: #fff !important; }
  .bg-orange { background-color: var(--kg-orange) !important; color: #fff !important; }
  .bg-red { background-color: var(--kg-red) !important; color: #fff !important; }

  /* Data Tables */
  .table-container {
    overflow-x: auto;
    padding: 0;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    text-align: left;
  }

  .data-table th, .data-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--kg-border);
    vertical-align: middle;
  }

  .data-table th {
    background-color: #f8fafc;
    font-weight: 600;
    color: var(--kg-text-muted);
  }

  .data-table tbody tr:hover {
    background-color: #f8fafc;
  }

  .data-table .center { text-align: center; }
  .data-table .muted { color: var(--kg-text-muted); }

  /* Action buttons inside tables */
  .act-btn {
    border: 0;
    background: transparent;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    transition: var(--transition-fast);
  }

  .act-btn.edit { color: var(--kg-blue); background-color: var(--kg-blue-light); }
  .act-btn.del { color: var(--kg-red); background-color: var(--kg-red-light); }
  .act-btn.ok { color: var(--kg-green); background-color: var(--kg-green-light); }
  .act-btn:hover { filter: brightness(0.95); }

  /* Dashboard Custom Assets */
  .quick-actions-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .quick-actions-grid .btn {
    min-height: 52px;
    border-radius: var(--radius-md);
    flex-direction: column;
    font-size: 12px;
    gap: 4px;
  }

  .quick-actions-grid .btn-icon {
    font-size: 16px;
  }

  .bar-chart-container {
    padding-top: 16px;
    height: 120px;
    display: flex;
    align-items: flex-end;
  }

  .bar-chart {
    display: flex;
    justify-content: space-around;
    width: 100%;
    height: 100%;
    align-items: flex-end;
  }

  .bar-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 10%;
  }

  .bar-val {
    font-size: 9px;
    font-weight: 700;
    color: var(--kg-navy);
  }

  .bar-inner {
    width: 24px;
    background: linear-gradient(to top, var(--kg-blue), var(--kg-orange));
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    min-height: 4px;
    transition: height 0.5s ease;
  }

  .bar-lbl {
    font-size: 10px;
    font-weight: 600;
    color: var(--kg-text-muted);
  }

  .mini-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .mini-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #f8fafc;
    border-radius: var(--radius-sm);
    font-size: 12px;
  }

  .mini-item .dish-name {
    font-weight: 600;
    color: var(--kg-navy);
  }

  .mini-item .dish-count {
    font-weight: 700;
    color: var(--kg-orange);
    background: var(--kg-orange-light);
    padding: 2px 6px;
    border-radius: 12px;
    font-size: 10px;
  }

  /* Status Badges */
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
  }

  .badge.active { color: var(--kg-green); background-color: var(--kg-green-light); }
  .badge.inactive { color: var(--kg-red); background-color: var(--kg-red-light); }

  /* Editor Header filters */
  .editor-header-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--kg-surface);
    border: 1px solid var(--kg-border);
    border-radius: var(--radius-md);
    padding: 12px 20px;
    box-shadow: var(--shadow-sm);
    gap: 12px;
  }

  .day-picker-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-grow: 1;
  }

  .day-picker-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--kg-text-muted);
    white-space: nowrap;
  }

  .date-select-input {
    max-width: 200px;
  }

  .editor-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Modals */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(7, 26, 61, 0.4);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-normal);
  }

  .modal.show {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-content {
    background-color: var(--kg-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    width: 90%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(-20px);
    transition: transform var(--transition-normal);
  }

  .modal.show .modal-content {
    transform: translateY(0);
  }

  .modal-header {
    padding: 16px 24px;
    background-color: #f8fafc;
    border-bottom: 1px solid var(--kg-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-header h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--kg-navy);
  }

  .modal-close {
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    color: var(--kg-text-muted);
  }

  .modal-body {
    padding: 24px;
    overflow-y: auto;
    max-height: 70vh;
  }

  .modal-footer {
    padding: 16px 24px;
    background-color: #f8fafc;
    border-top: 1px solid var(--kg-border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .hidden { display: none !important; }

  /* Loading Spinner */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.85);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }

  .spinner-container {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid var(--kg-border);
    border-top-color: var(--kg-orange);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-message {
    font-size: 13px;
    font-weight: 600;
    color: var(--kg-navy);
  }

  /* Toasts */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background-color: var(--kg-navy);
    color: #ffffff;
    padding: 12px 24px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    z-index: 3000;
    transform: translateY(100px);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .toast.success { background-color: var(--kg-green); }
  .toast.error { background-color: var(--kg-red); }

  /* Preview Workspace styling */
  .preview-workspace {
    width: 100%;
    display: flex;
    justify-content: center;
    overflow-x: auto;
  }

  .paper-preview-container {
    background: #e2e8f0;
    padding: 16px;
    border-radius: var(--radius-md);
    width: 100%;
    max-width: 1180px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
  }

  .preview-iframe {
    width: 297mm;
    height: 210mm;
    border: 0;
    background: #fff;
    box-shadow: var(--shadow-lg);
    border-radius: var(--radius-sm);
  }

  .search-box {
    position: relative;
    max-width: 260px;
    flex-grow: 1;
  }

  .top-filter {
    background: var(--kg-surface);
    border: 1px solid var(--kg-border);
    border-radius: var(--radius-md);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .month-selector-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .month-selector-wrapper label {
    font-size: 12px;
    font-weight: 600;
    color: var(--kg-text-muted);
  }

  .month-picker-input {
    width: 160px;
    min-height: 34px;
  }

  /* Responsive styling */
  @media(max-width: 1024px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; border-right: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .main { max-width: 100%; padding: 16px; }
    .cards { grid-template-columns: repeat(2, 1fr); }
    .grid { display: flex; flex-direction: column; }
  }
</style>
